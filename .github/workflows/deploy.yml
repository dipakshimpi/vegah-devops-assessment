name: CI/CD Pipeline

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      rollback_tag:
        description: 'Image tag (commit SHA) to rollback to'
        required: false
        default: ''

# Concurrency group ensures two pushes don't attempt to deploy simultaneously
concurrency:
  group: production-deploy
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  # ── 1. TEST & BUILD CHECKS ──────────────────────────────────────────────────
  # Verifies TypeScript compilation and code health before touching any containers.
  test:
    name: Test & Build Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: |
            backend/package.json
            worker/package.json
            frontend/package.json

      - name: Verify Backend Build
        run: |
          cd backend
          npm install
          npm run build

      - name: Verify Worker Build
        run: |
          cd worker
          npm install
          npm run build

      - name: Verify Frontend Build
        run: |
          cd frontend
          npm install
          npm run build

  # ── 2. DOCKER BUILD, SECURITY SCAN, & PUSH TO GHCR ──────────────────────────
  # Builds images in parallel using a matrix, scans with Trivy, pushes to GHCR.
  build-and-push:
    name: Build & Push (${{ matrix.service }})
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [frontend, backend, worker]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Downcase repository name
        id: repo_name
        run: |
          REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "IMAGE_NAME=${{ env.REGISTRY }}/${REPO_LOWER}/${{ matrix.service }}" >> $GITHUB_ENV

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=,format=long
            type=sha,prefix=,format=short
            type=raw,value=latest

      # Build image locally first so Trivy can scan it
      - name: Build image locally
        uses: docker/build-push-action@v5
        with:
          context: ./${{ matrix.service }}
          file: ./${{ matrix.service }}/Dockerfile
          load: true
          tags: ${{ matrix.service }}:test
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

      # DevSecOps: Scan local image for critical CVEs before publishing
      - name: Run Trivy Vulnerability Scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: '${{ matrix.service }}:test'
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      # Push verified image to GHCR
      - name: Push verified image to GHCR
        uses: docker/build-push-action@v5
        with:
          context: ./${{ matrix.service }}
          file: ./${{ matrix.service }}/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service }}

  # ── 3. CONTINUOUS DEPLOYMENT (AWS EC2 over Native SSH) ─────────────────────
  # Delivers docker-compose.yml & Caddyfile, pulls new SHA images from GHCR,
  # and restarts containers on the live EC2 instance with zero external action dependencies.
  deploy:
    name: Deploy to AWS EC2
    needs: build-and-push
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure SSH and Deploy to EC2
        env:
          RAW_HOST: ${{ secrets.EC2_HOST }}
          RAW_USER: ${{ secrets.EC2_USER || 'ubuntu' }}
          SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          TARGET_TAG: ${{ github.event.inputs.rollback_tag || github.sha }}
        run: |
          # Sanitize host and user (strip any accidental spaces, newlines, or carriage returns)
          HOST=$(echo "$RAW_HOST" | tr -d '[:space:]')
          SSH_USER=$(echo "$RAW_USER" | tr -d '[:space:]')

          # 1. Setup SSH directory and private key
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts

          # 2. Copy configuration files cleanly to /opt/app
          scp -i ~/.ssh/id_rsa -o StrictHostKeyChecking=accept-new docker-compose.yml "${SSH_USER}@${HOST}:/opt/app/docker-compose.yml"
          scp -i ~/.ssh/id_rsa -o StrictHostKeyChecking=accept-new Caddyfile "${SSH_USER}@${HOST}:/opt/app/Caddyfile"

          # 3. Pull new SHA images, reload containers, and verify healthcheck
          ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=accept-new "${SSH_USER}@${HOST}" bash -s << EOF
            set -e
            cd /opt/app
            export TAG=${TARGET_TAG}
            docker compose pull
            docker compose up -d
            docker image prune -f
            sleep 10
            curl -f http://localhost/api/health || exit 1
            echo "Deployment successful for commit ${TARGET_TAG}"
          EOF



